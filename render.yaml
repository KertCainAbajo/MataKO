# Render Blueprint for the MataKo backend and admin (free plan).
# Values marked "sync: false" are secrets: Render asks for them in its dashboard; they are never stored here.
services:
  - type: web
    name: matako
    runtime: docker
    plan: free
    # Closest Render region to the Philippines; create the Neon database in Singapore too.
    region: singapore
    rootDir: backend-app
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: MataKo
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_DISPLAY_TIMEZONE
        value: Asia/Manila
      # Neon PostgreSQL: paste the full connection string (postgresql://…?sslmode=require).
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # Render's proxy sits in front of the app; trust it so HTTPS and visitor addresses are seen correctly.
      - key: TRUSTED_PROXIES
        value: "*"
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # First admin, created on startup if it does not exist (12+ characters, upper/lower case, number, symbol).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: MataKo Admin
